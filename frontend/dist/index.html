<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js IoT</title>
    <style>body {
  color: #111827;
  background: #f5f7fb;
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  width: min(1200px, 100% - 32px);
  margin: 24px auto 32px;
}

.status {
  color: #4b5563;
  margin: 0 0 16px;
}

.chart-grid {
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  display: grid;
}

.chart-card {
  background: #fff;
  border: 1px solid #dbe2ea;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 30px #1118270f;
}

.chart-card h2 {
  margin: 0 0 6px;
  font-size: 18px;
}

.chart-card p {
  color: #6b7280;
  margin: 0 0 12px;
  font-size: 13px;
  line-height: 1.5;
}

.chart-wrap {
  height: 320px;
}

.error {
  color: #b42318;
  background: #fef3f2;
  border: 1px solid #fecdca;
  border-radius: 12px;
  padding: 12px 14px;
}
</style>
  </head>
  <body>
    <main class="page">
      <div id="status" class="status">Memuat data sensor...</div>
      <section id="chartGrid" class="chart-grid"></section>
    </main>
    <script type="module" src="/frontend.ee3750bf.js"></script>
  
</body></html>
